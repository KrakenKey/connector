name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every module builds against its own go.mod; go.work is for local development.
env:
  GOWORK: 'off'

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/krakenkey-connector

  plugin-list:
    name: List plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: |
          plugins=$(find plugins -mindepth 2 -maxdepth 2 -name go.mod -printf '%h\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  # Each plugin is its own Go module, so the root job above does not cover
  # it.
  plugin:
    name: Plugin ${{ matrix.dir }}
    needs: plugin-list
    if: needs.plugin-list.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plugin-list.outputs.plugins) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy -diff

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml"

      - name: Run tests
        run: go test ./... -race

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/...

  # The aws-acm tests run against the fake ACM above; this job repeats the
  # end-to-end case against LocalStack. 4.14.0 is the last community image
  # that starts without a LocalStack account token.
  aws-acm-localstack:
    name: aws-acm against LocalStack
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: acm
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: plugins/aws-acm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: plugins/aws-acm/go.sum

      - name: Run LocalStack tests
        env:
          KK_TEST_LOCALSTACK_ENDPOINT: http://localhost:4566
        run: go test ./internal/acmtarget/ -run LocalStack -v -count=1

  release-snapshot:
    name: Release build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The release workflow signs with cosign; installing it here makes a
      # bad action reference fail on pull requests instead of at release time.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Check cosign
        run: cosign version

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Check config
        run: goreleaser check

      # The same commit with a lower version (0.0.1-SNAPSHOT-...), for the
      # package upgrade check below. Only the binaries are compiled twice,
      # and those mostly come from the build cache.
      - name: Snapshot build of an older version
        env:
          GORELEASER_CURRENT_TAG: v0.0.1
        run: |
          goreleaser release --snapshot --clean --skip=publish,sign,docker
          mv dist "$RUNNER_TEMP/dist-old"

      # Builds every archive (the connector and each plugin), the .deb and
      # .rpm packages, the Homebrew cask and both image architectures without
      # publishing or signing, so a broken release config shows up here, not
      # on a tag.
      - name: Snapshot build
        run: goreleaser release --snapshot --clean --skip=publish,sign

      # The amd64 snapshot image must carry the plugin binaries GoReleaser
      # built, with a plugins.lock that matches them, and the connector must
      # find and start them as the image's non-root user.
      - name: Check the plugins in the image
        run: |
          version=$(jq -r .version dist/metadata.json)
          scripts/check-image-plugins.sh "ghcr.io/krakenkey/connector:v${version}-amd64" "$version" dist

      # The packages must install, carry the plugin binaries GoReleaser
      # built with a matching plugins.lock, let the service user start every
      # plugin with `validate --offline`, and remove cleanly. Upgrading from
      # the older build must keep plugins without a version working.
      - name: Check the amd64 packages
        run: |
          version=$(jq -r .version dist/metadata.json)
          old="$RUNNER_TEMP/dist-old"
          scripts/check-packages.sh debian:12 "dist/krakenkey-connector_${version}_linux_amd64.deb" linux/amd64 "$old"/krakenkey-connector_*_linux_amd64.deb
          scripts/check-packages.sh rockylinux:9 "dist/krakenkey-connector_${version}_linux_amd64.rpm" linux/amd64 "$old"/krakenkey-connector_*_linux_amd64.rpm

      # The arm64 packages are checked on an arm64 runner: under QEMU the
      # connector cannot start plugins through /proc/self/fd.
      - name: Keep the arm64 packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-arm64
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/krakenkey-connector_*_linux_arm64.deb
            dist/krakenkey-connector_*_linux_arm64.rpm
            dist/plugin-*_linux_arm64*/krakenkey-connector-plugin-*

  packages-arm64:
    name: Check the arm64 packages
    needs: release-snapshot
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages-arm64
          path: dist

      - name: Check the arm64 packages
        run: |
          scripts/check-packages.sh debian:12 dist/krakenkey-connector_*_linux_arm64.deb linux/arm64
          scripts/check-packages.sh rockylinux:9 dist/krakenkey-connector_*_linux_arm64.rpm linux/arm64

  # The Azure template in deploy/azure: mainTemplate.json must be what
  # main.bicep compiles to, the package must pass the ARM template test
  # toolkit that Partner Center runs, and the cloud-config it builds must
  # pass cloud-init's schema check. Nothing is deployed.
  azure-template:
    name: Azure template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: mainTemplate.json matches main.bicep
        run: deploy/azure/build.sh --check

      - name: Test the template
        run: deploy/azure/test.sh

      - name: Build the Marketplace package
        run: deploy/azure/package.sh

  proto:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Regenerate
        run: ./scripts/protogen.sh

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "Generated code is out of date. Run 'make proto' and commit the result."
            exit 1
          fi
