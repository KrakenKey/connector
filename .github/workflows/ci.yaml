name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/krakenkey-connector

  proto:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Regenerate
        run: ./scripts/protogen.sh

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "Generated code is out of date. Run 'make proto' and commit the result."
            exit 1
          fi
