name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # create the GitHub release and upload assets
  packages: write    # push ghcr.io/krakenkey/connector
  id-token: write    # keyless Sigstore signing with the workflow's OIDC token

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the connector from its own go.mod, not the go.work
          # workspace that also holds the plugin modules.
          GOWORK: 'off'
